name: Build & Push to ACR

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build & Push Image to ACR
      run: |
        az acr login --name adler1981
        docker build -t adler1981.azurecr.io/azure-vote:v1 ./azure-vote
        docker push adler1981.azurecr.io/azure-vote:v1